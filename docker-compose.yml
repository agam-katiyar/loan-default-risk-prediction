version: '3.8'

services:
  api:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./models:/app/models     # mount models folder so we don't bake them into the image
    environment:
      - MODEL_PATH=models/xgboost_final.pkl
      - SCALER_PATH=models/scaler.pkl
    restart: unless-stopped
